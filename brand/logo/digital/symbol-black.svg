<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="#000000"><title>Ilham Bintang Satria logo</title>
  
  <!-- The decision, opened by light.
       The flowchart decision diamond, cut through by a vertical slot. The slot reads
       as an I. Points overshoot the 24/232 box by 2 units so the mark looks the same
       size as a square one beside it; the slot sits 3 units above geometric centre,
       because optical centre is higher than measured centre. -->
  <path fill-rule="evenodd" d="
    M 128 24 L 232 128 L 128 232 L 24 128 Z
    M 112 63 L 144 63 L 144 187 L 112 187 Z
  "/>
</svg>
